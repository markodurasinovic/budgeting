name: Budgeting
options:
  bundleIdPrefix: com.markodurasinovic
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  BudgetingKit:
    path: ./BudgetingKit

targets:
  BudgetingMac:
    type: application
    platform: macOS
    sources:
      - path: BudgetingMac
    dependencies:
      - package: BudgetingKit
    entitlements:
      path: BudgetingMac/BudgetingMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markodurasinovic.Budgeting.Mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"